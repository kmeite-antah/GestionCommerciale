spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
# Profil "test" explicite : ni le profil "dev" (clé JWT de dev, UtilisateurSeeder) ni la
# configuration de production ne s'appliquent pendant les tests.
spring.profiles.active=test

# Clé JWT réservée aux tests (le code n'en fournit plus aucune par défaut).
jwt.secret=test-only-gestion-commerciale-jwt-key-32-caracteres-min
jwt.expiration-ms=3600000

# Email (alerte stock) : valeurs neutres pour que le contexte Spring démarre en test sans
# dépendre d'un vrai serveur SMTP ni de variables d'environnement.
spring.mail.host=localhost
spring.mail.port=587
management.health.mail.enabled=false
alerte.stock.destinataire=test@example.com
alerte.stock.cron=0 0 8 * * *

# Factures PDF : dossier dédié aux tests, distinct de celui utilisé en développement.
facture.stockage.dossier=./target/factures-test
