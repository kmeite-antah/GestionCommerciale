# Profil de développement local, actif par défaut (spring.profiles.default=dev).
# Ne jamais activer ce profil en production.

# Clé JWT de développement uniquement : elle est publique (commitée), donc sans valeur
# en production. JWT_SECRET reste prioritaire s'il est défini sur le poste.
jwt.secret=${JWT_SECRET:dev-only-gestion-commerciale-jwt-key-ne-pas-utiliser-en-prod}
