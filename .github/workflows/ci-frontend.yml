name: CI Frontend

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # check-latest : sans lui, le runner peut réutiliser une 22.x en cache plus ancienne
      # que la 22.22.3 exigée par l'Angular CLI.
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Build application
        working-directory: frontend
        run: npm run build
